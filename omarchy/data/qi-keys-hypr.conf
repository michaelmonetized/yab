# Qi (CEF) Super keys.
# Each bind does nothing unless the focused window's class is qi-cef.
# Qi does not install this file. Copy the lines you want into your own Hyprland config.
# ~/.config/qi/keys.toml can rename a shortcut. A Super chord still has to match a line here,
# because CEF accelerators have no Super flag.

bind = SUPER, T, exec, sh -c "hyprctl activewindow -j | grep -q '\"class\": \"qi-cef\"' && exec qi-cef --browser=qi --command=new-tab"
bind = SUPER, W, exec, sh -c "hyprctl activewindow -j | grep -q '\"class\": \"qi-cef\"' && exec qi-cef --browser=qi --command=close-tab"
bind = SUPER, L, exec, sh -c "hyprctl activewindow -j | grep -q '\"class\": \"qi-cef\"' && exec qi-cef --browser=qi --command=focus-location"
bind = SUPER, N, exec, sh -c "hyprctl activewindow -j | grep -q '\"class\": \"qi-cef\"' && exec qi-cef --browser=qi --command=new-window"
bind = SUPER SHIFT, N, exec, sh -c "hyprctl activewindow -j | grep -q '\"class\": \"qi-cef\"' && exec qi-cef --browser=qi --command=private-window"
bind = SUPER SHIFT, W, exec, sh -c "hyprctl activewindow -j | grep -q '\"class\": \"qi-cef\"' && exec qi-cef --browser=qi --command=close-window"
bind = SUPER SHIFT, D, exec, sh -c "hyprctl activewindow -j | grep -q '\"class\": \"qi-cef\"' && exec qi-cef --browser=qi --command=pin-tab"
