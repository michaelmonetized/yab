# Qi on Hyprland / Omarchy. Copy what you want into your Hyprland config.
# Qi's Wayland app_id is "qi".
#
# Simplest: `make default-browser`, and Omarchy's own browser binds launch
# Qi (its --private / --incognito flags are understood).

# A dedicated bind (choose a key your setup doesn't already use).
# bindd = SUPER SHIFT ALT, O, Qi, exec, qi

# Qi paints an opaque background from the theme; keep it opaque even if
# other windows are translucent. Window rule syntax changes between Hyprland
# releases, so adjust this line if yours rejects it.
# windowrule = opacity 1 1, class:^(qi)$
#
# Qi (CEF) is a separate app. Its Wayland app_id is "qi-cef".
# bindd = SUPER SHIFT ALT, C, Qi (CEF), exec, qi-cef
# windowrule = opacity 1 1, class:^(qi-cef)$
