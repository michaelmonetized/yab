# Omaweb on Hyprland / Omarchy. Copy what you want into your Hyprland config.
# Omaweb's Wayland app_id is "omaweb".
#
# Simplest: `make default-browser`, and Omarchy's own browser binds launch
# Omaweb (its --private / --incognito flags are understood).

# A dedicated bind (choose a key your setup doesn't already use).
# bindd = SUPER SHIFT ALT, O, Omaweb, exec, omaweb

# Omaweb paints an opaque background from the theme; keep it opaque even if
# other windows are translucent. Window rule syntax changes between Hyprland
# releases, so adjust this line if yours rejects it.
# windowrule = opacity 1 1, class:^(omaweb)$
