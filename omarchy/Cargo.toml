[package]
name = "omaweb"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Omaweb: a keyboard-first, Omarchy-themed Wayland browser. A Rust + Qt Quick rewrite of Yab for Linux."
repository = "https://github.com/michaelmonetized/yab"
rust-version = "1.85"

[[bin]]
name = "omaweb"
path = "src/main.rs"

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
notify = "8"
percent-encoding = "2"

[build-dependencies]
cxx-qt-build = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
