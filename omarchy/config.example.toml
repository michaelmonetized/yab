# ~/.config/qi/config.toml. Every key is optional.

# Page for a fresh window with nothing to restore. Empty = start page.
homepage = ""

# Search for anything that isn't an address. {} is the query.
search = "https://duckduckgo.com/?q={}"

# "sidebar" (default): Yab's look. No toolbar, no address bar, the page
# edge to edge. Tabs live in a sidebar that slides in when the pointer
# touches the left edge (or Ctrl+Shift+B) and hides when it leaves;
# Ctrl+L / Ctrl+T bring up the address field as a palette.
# "top": classic tab strip and address bar. ("left" means "sidebar".)
tabs = "sidebar"

# Keep the sidebar open beside the page instead of revealing it on demand.
# Ctrl+Shift+B or the sidebar's top-left button toggles it at run time.
pin_sidebar = false

# No window frame or title bar. On Hyprland the compositor draws the
# border anyway; on X11 drag the sidebar's top row to move the window and
# the window edges to resize it.
frameless = true

# Bring last session's tabs back (private tabs never are).
restore_session = true

# tabs = "top" only: start with the tab strip and toolbar hidden;
# Ctrl+Shift+B toggles, Ctrl+L shows the address field on its own.
compact = false

# Default zoom, 1.0 = 100 %.
zoom = 1.0

# Move today's (unpinned) tabs nobody touched for this many hours to the
# archive (Ctrl+Alt+A). 0 = never.
archive_after_hours = 12.0

# Peek: links that ask for a new window and pop-ups open in a card over
# the page. false = they open as tabs.
peek = true

# Force a dark rendering of every page (Chromium's auto dark mode).
force_dark = false

# The profile new spaces and plain `qi` use. Profiles are made in
# Settings or with `qi --profile NAME`.
default_profile = "Default"

# Ad and tracker blocking inside the engine, before requests are made.
[blocker]
enabled = true
# Hosts files or adblock lists (||domain^ rules), URLs or file:// paths.
# Refreshed weekly into ~/.cache/qi/lists.
lists = ["https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts&showintro=0&mimetype=plaintext"]
# Sites never blocked on (Ctrl+E toggles the current one).
allow = []

# The agent panel (Ctrl+Shift+A): any OpenAI-compatible chat API.
[agent]
endpoint = "https://api.openai.com/v1"
model = "gpt-4o-mini"
# The key is read from this environment variable (then OPENAI_API_KEY),
# else from api_key_command's output. Local endpoints need none.
# Never put a key in a file you share.
api_key_env = "QI_AGENT_API_KEY"
api_key_command = ""
# How much of the page's visible text is sent, in characters.
max_page_chars = 12000
# Extra standing instructions for the agent.
instructions = ""
# Ask before the agent clicks or types on a page.
confirm_actions = true

# Keyword searches, on top of the built-ins (g, ddg, gh, yt, w, aw, aur,
# pkg, crates, hypr). Type "rs serde" to search docs.rs.
[keywords]
rs = "https://docs.rs/releases/search?query={}"
